# CI for ReMgr.
#
# ReMgr is developed for OpenBSD (it need(2)s pledge/unveil). GitHub has no OpenBSD
# *runner*, but it does have Linux runners that can boot one in QEMU, so the
# sanctioned platform is built too — in a real OpenBSD VM, with the packages and
# environment `scripts/openbsd-build.sh` documents. That is what makes the release
# asset genuine rather than a locally built binary somebody remembers to attach.
# Everything verified here:
#
#   1. `remgr-frps` — the frp wire-protocol implementation (server + client) —
#      builds and its unit tests pass. Deliberately platform-independent, which
#      `scripts/check-repo.sh` enforces, because that is what makes this possible.
#   2. The web console — its one inline script parses, every handler used by an
#      inline attribute exists, every widget kind has a renderer, and every
#      endpoint it calls exists in the router.
#   3. Repository hygiene — no credentials/keys/logs/build output tracked.
#   4. **Linux, Windows and OpenBSD release builds of the whole service**, plus a
#      runtime smoke test on Linux: start it against a scratch `REMGR_HOME`, fetch
#      the console over HTTP, and shut it down with SIGTERM. That is what proves
#      the portability layer actually works rather than merely compiling.
#
# The Linux and Windows builds need LLVM: `kcp-sys` (via EasyTier) and
# `machine-uid` (via the RustDesk server) run bindgen at build time, which loads
# libclang. The OpenBSD VM installs its own llvm/protobuf packages.
#
# Deployment on OpenBSD (install + rcctl) stays manual; see the README and
# `scripts/preflight.sh`.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # the dependency tree is large; a cold release build is the slowest step
  CARGO_BUILD_JOBS: 4
  # Vendored EasyTier patches use `#![feature(cfg_select)]`, which stable rustc
  # refuses (the feature is only stable since 1.95, and the attribute is an error
  # either way). This is the same variable the OpenBSD build documents in
  # scripts/openbsd-build.sh; ReMgr's own code does not need it.
  RUSTC_BOOTSTRAP: "1"

jobs:
  frp-protocol:
    name: frp protocol crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # only this crate is compiled, so cache what it needs
          workspaces: remgr-frps

      - name: The workspace resolves (Cargo.lock is in sync)
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check (all targets, warnings are visible)
        run: cargo check --locked -p remgr-frps --all-targets

      - name: Build (release, as shipped)
        run: cargo build --locked --release -p remgr-frps

      - name: Tests (framing, crypto reference vectors, udp/tcp tunnels, config)
        run: cargo test --locked --release -p remgr-frps

      - name: Build the interop harness (examples/frpc_probe)
        run: cargo build --locked --release -p remgr-frps --example frpc_probe

      - name: The self-test inside the harness
        run: ./target/release/examples/frpc_probe --self-test

  console:
    name: web console checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node is preinstalled on the runners, so the script's syntax check runs
      # (it is skipped with a warning where node is absent, e.g. a bare host).
      - name: Console SPA (script parses, handlers, widgets, endpoints)
        run: sh scripts/check-console.sh remgr/src/console/assets/index.html remgr/src/console/mod.rs

      - name: Shell scripts parse
        run: |
          set -e
          for f in scripts/*.sh scripts/rc.d/remgr; do
            [ -f "$f" ] || continue
            sh -n "$f"
            echo "ok    $f"
          done

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh scripts/check-repo.sh

  # The sanctioned platform, built on the target's own kernel: a real OpenBSD VM in
  # QEMU on a Linux runner. GitHub has no OpenBSD runner, which is why this used to
  # be a manual step -- and a manual step is a step that gets skipped: the release
  # lost its `remgr-openbsd-amd64` asset when a later publish deleted every asset it
  # found and re-uploaded only the two CI builds, and nobody re-attached it.
  #
  # The packages and the variables are the ones `scripts/openbsd-build.sh` records
  # as verified (rust 1.94.x, llvm19 for libclang, protobuf for protoc). The script
  # itself is run, not re-implemented, so the documented build and the shipped
  # binary cannot drift apart.
  openbsd-build:
    name: release build (openbsd-amd64)
    needs: [frp-protocol]
    runs-on: ubuntu-latest
    # a cold release build of this dependency tree on two vCPUs, plus the VM boot
    # and `pkg_add`. Generous on purpose: hitting this limit wastes the whole build.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build in a real OpenBSD VM
        uses: vmactions/openbsd-vm@v1.4.8
        with:
          release: '7.9'
          # two cores and 8 GB: one vcpu thrashes on a build this size
          cpu: 2
          mem: 8192
          sync: rsync
          # The workspace is synced back to the runner after this step, which is how
          # the binary reaches the upload step below -- so copyback must stay on
          # (the default). That is also why the build is told to put its target
          # directory *outside* the workspace: several GB of dependency
          # intermediates would otherwise be rsynced back for nothing.
          prepare: |
            set -e
            # Exact versions, because `pkg_add` resolves a stem and refuses an
            # ambiguous one in a non-interactive shell: there is no `llvm19`
            # package (the stem is `llvm`, with 19/20/21 as branches, so the bare
            # name would have to guess) and `rust` alone matches rust-analyzer,
            # rust-bootstrap and friends. These are the versions the header of
            # scripts/openbsd-build.sh records as verified.
            pkg_add rust-1.94.1 llvm-19.1.7p14 protobuf-6.34.1 git-2.53.0
            # And prove the environment is the one the build expects, here, where a
            # message is cheap -- rather than 30 minutes into a compile. libclang is
            # located the same way the build script locates it, so this cannot
            # disagree with the build. Note the name: the package installs
            # `libclang.so.0.0` with no unversioned symlink.
            for t in cargo protoc git; do
              command -v $t >/dev/null || { echo "missing $t after pkg_add"; exit 1; }
            done
            clang=$(find /usr/local -maxdepth 4 -name 'libclang.so*' -type f 2>/dev/null | head -1) || true
            [ -n "$clang" ] || { echo "libclang.so* not installed by the llvm package"; exit 1; }
            echo "libclang at $clang"
            echo "prepare ok: cargo=$(cargo --version), protoc=$(protoc --version), git=$(git --version)"
          run: |
            set -e
            # Where to build. The OpenBSD image's root partition is small -- a
            # multi-GB target directory there dies with ENOSPC within minutes -- so
            # the two candidates are the workspace (a mount from the host) and /tmp
            # (mfs, i.e. memory plus swap). /tmp wins on speed of transfer and on
            # not needing the 4 GB to be synced back; the cost is that the VM
            # swaps, which makes the build roughly twice as long. The job timeout
            # is set for that.
            export CARGO_TARGET_DIR=/tmp/remgr-target
            # ksh, not sh: the script is /bin/ksh and OpenBSD's sh is not ksh
            ksh scripts/openbsd-build.sh
            ls -lh "$CARGO_TARGET_DIR/release/remgr"
            # Prove it is a real OpenBSD binary by RUNNING it -- we are on OpenBSD,
            # so that is both the strongest check available and the one that matters.
            # (`file | grep OpenBSD` is not: the OS name in file's output comes from
            # the .note.openbsd.ident brand note, which the linker need not emit.)
            "$CARGO_TARGET_DIR/release/remgr" --version
            file "$CARGO_TARGET_DIR/release/remgr"
            # Hand it to the host: anything written inside the workspace is synced
            # back to the runner after this step. A subdirectory, because
            # upload-artifact stores a lone file under its own name and the publish
            # job reads every platform as `dist/<artifact>/remgr` -- and `remgr`
            # itself is already a directory here (the crate), so it cannot be used
            # as a file name at the workspace root.
            mkdir -p ob-amd64
            cp "$CARGO_TARGET_DIR/release/remgr" ob-amd64/remgr
            ls -lh ob-amd64/remgr

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: remgr-openbsd-amd64
          path: ob-amd64/remgr
          if-no-files-found: error
          retention-days: 30

  build:
    name: release build (${{ matrix.name }})
    needs: [frp-protocol]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: remgr
          - name: windows-x86_64
            os: windows-latest
            binary: remgr.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned so the release binary is reproducible: a floating `stable`
          # would silently change the compiler between two builds of the same
          # commit, and then the artifact a deployment downloads is no longer
          # the one this run verified. Bump deliberately, in its own commit.
          toolchain: 1.99.0

      - name: Install build prerequisites (LLVM for bindgen, protoc for the protobuf codegen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang:      kcp-sys (EasyTier) and machine-uid (RustDesk) run bindgen
          # protoc:        the pros* crates generate EasyTier's protobuf types
          # libprotobuf-dev: the .proto files protoc imports, google/protobuf/*
          sudo apt-get install -y --no-install-recommends libclang-dev llvm protobuf-compiler libprotobuf-dev
          libclang=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' | head -1)
          [ -n "$libclang" ] || { echo "libclang.so not found — libclang-dev did not install"; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          wkt=$(dpkg -L libprotobuf-dev | grep -m1 'google/protobuf/timestamp.proto$' || true)
          [ -n "$wkt" ] || { echo "libprotobuf-dev does not ship the well-known .proto files"; exit 1; }
          # protoc's -I root is three levels above the file (…/<inc>/google/protobuf/timestamp.proto)
          inc=$(dirname "$(dirname "$(dirname "$wkt")")")
          echo "PROTOC_INCLUDE=$inc" >> "$GITHUB_ENV"
          echo "protoc: $(protoc --version), includes: $inc"

      - name: Verify the prerequisites actually work
        if: runner.os == 'Linux'
        run: |
          # A one-line probe: if protoc cannot resolve the well-known types here,
          # the real build fails 20 minutes later with the same message buried in
          # the dependency output. Fail now instead.
          cat > /tmp/probe.proto <<'EOF'
          syntax = "proto3";
          package probe;
          import "google/protobuf/timestamp.proto";
          message Probe { google.protobuf.Timestamp at = 1; }
          EOF
          protoc -I /tmp -o /dev/null /tmp/probe.proto
          echo "protoc resolves google/protobuf/timestamp.proto"

      - name: Install build prerequisites (LLVM for bindgen, protoc for the protobuf codegen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest ships neither a libclang cargo can find nor protoc
          choco install llvm protoc --no-progress -y
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvm "libclang.dll"))) { throw "libclang.dll missing in $llvm" }

          # Find the *real* protoc, not the chocolatey shim in ...\chocolatey\bin:
          # deriving the include directory from the shim lands in the wrong place.
          $protoc = Get-ChildItem "C:\ProgramData\chocolatey\lib\protoc" -Recurse -Filter protoc.exe -ErrorAction SilentlyContinue |
                      Select-Object -First 1
          if (-not $protoc) { throw "protoc.exe not found under chocolatey\lib\protoc" }

          # Derive the include root from the well-known file itself, which is what
          # protoc has to resolve, rather than guessing a directory layout.
          $wkt = Get-ChildItem (Join-Path $protoc.DirectoryName "..") -Recurse -Filter timestamp.proto -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'google\\protobuf\\timestamp\.proto$' } |
                   Select-Object -First 1
          if (-not $wkt) { throw "google/protobuf/timestamp.proto not found beside $($protoc.FullName)" }
          $inc = Split-Path (Split-Path (Split-Path $wkt.FullName -Parent) -Parent) -Parent

          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvm"
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$($protoc.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC_INCLUDE=$inc"
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
          Add-Content -Path $env:GITHUB_PATH -Value $protoc.DirectoryName
          & $protoc.FullName --version
          Write-Host "protoc: $($protoc.FullName), includes: $inc"

          # pnet_sys (via EasyTier's pnet_datalink) links the NDIS `Packet.lib`, which
          # is not part of any toolchain the runner ships: it comes from the WDK or
          # from the Npcap SDK, and the runner's "Driver Kit" component is only the
          # Visual Studio integration (the km\x64 libraries are absent). Without it
          # the link dies with `LNK1181: cannot open input file 'Packet.lib'`.
          # Prefer the WDK when an image happens to have it (it also carries the
          # driver-side pieces), otherwise take the 345 KB Npcap SDK, which is the
          # alternative pnet's own documentation gives. The version is pinned so the
          # link inputs do not change under us.
          $packet = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Recurse -Filter Packet.lib -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '\\km\\x64\\Packet\.lib$' } |
                      Select-Object -First 1

          if (-not $packet) {
            $sdk = Join-Path $env:RUNNER_TEMP "npcap-sdk-1.16.zip"
            $dest = Join-Path $env:RUNNER_TEMP "npcap-sdk"
            Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile $sdk -UseBasicParsing
            Expand-Archive -Path $sdk -DestinationPath $dest -Force
            $packet = Join-Path $dest "Lib\x64\Packet.lib"
            if (-not (Test-Path $packet)) { throw "Packet.lib missing from the Npcap SDK archive" }
            $packet = Get-Item $packet
          }
          Write-Host "Packet.lib: $($packet.FullName)"
          # RUSTFLAGS is the only way to reach a dependency's link step from here
          # (its own build script cannot be injected into).
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-L native=$($packet.DirectoryName)"
          Write-Host "Packet.lib taken from the Npcap SDK — this is the *link* input only."
          Write-Host "The built binary additionally needs the Npcap runtime (Packet.dll) at load time; the smoke-test step below checks for it and explains what it does when it is missing."

      - name: Verify the prerequisites actually work
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # see the Linux probe above: fail here rather than in the dependency build
          $probe = Join-Path $env:RUNNER_TEMP "probe.proto"
          @'
          syntax = "proto3";
          package probe;
          import "google/protobuf/timestamp.proto";
          message Probe { google.protobuf.Timestamp at = 1; }
          '@ | Set-Content -Path $probe -Encoding ascii
          $out = Join-Path $env:RUNNER_TEMP "probe.out"
          & protoc -I $env:RUNNER_TEMP -o $out $probe
          if ($LASTEXITCODE -ne 0) { throw "protoc could not resolve the well-known types" }
          Write-Host "protoc resolves google/protobuf/timestamp.proto"

      - uses: Swatinem/rust-cache@v2

      - name: Build the service (release, as shipped)
        run: cargo build --locked --release -p remgr

      - name: The frp crate's tests, on this platform
        run: cargo test --locked --release -p remgr-frps

      # The signal-provenance tests (cfg(unix), so they compile out on Windows)
      # and the path-layout test live in the service crate itself. --release
      # reuses the dependency artefacts the build above just made.
      - name: The service crate's unit tests
        run: cargo test --locked --release -p remgr

      - name: Smoke test — start, serve the console, shut down cleanly
        if: runner.os == 'Linux'
        run: |
          set -eu
          home=$(mktemp -d)
          # every module off, so this test is only about the process coming up,
          # generating its first-boot certificate, finding its directories and
          # stopping on SIGTERM. The console is left at the default 9443 so the
          # port check matches what the docs promise; -k is used for its
          # self-signed first-boot certificate (which this also exercises —
          # certificate generation is filesystem work that the port has to get right).
          cat > "$home/config.toml" <<EOF
          [console]
          port = 9443
          username = "admin"
          password_hash = ""
          session_ttl = 604800

          [easytier]
          enabled = false

          [stun_turn]
          enabled = false

          [rustdesk]
          enabled = false

          [frps]
          enabled = false

          [frpc]
          enabled = false
          EOF
          REMGR_HOME="$home" ./target/release/remgr --config "$home/config.toml" > "$home/out.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if curl -kfs -o /dev/null "https://127.0.0.1:9443/"; then break; fi
            if ! kill -0 $pid 2>/dev/null; then echo "process died early:"; cat "$home/out.log"; exit 1; fi
            sleep 0.5
          done
          curl -kfs -o /dev/null "https://127.0.0.1:9443/" || { echo "console did not serve"; cat "$home/out.log"; exit 1; }
          code=$(curl -ks -o /dev/null -w '%{http_code}' -X POST "https://127.0.0.1:9443/api/login" \
                   -H 'content-type: application/json' -d '{"username":"admin","password":"admin"}')
          [ "$code" = "200" ] || { echo "login returned $code"; cat "$home/out.log"; exit 1; }
          grep -q "installed the default login admin" "$home/out.log" || { echo "no default login in the log"; cat "$home/out.log"; exit 1; }
          grep -q "generated a P-384 self-signed certificate" "$home/out.log" || { echo "no first-boot certificate"; cat "$home/out.log"; exit 1; }
          # the whole layout must be under REMGR_HOME, certificates included
          for d in "" /ssl /log /run; do
            [ -d "$home$d" ] || { echo "missing $home$d"; find "$home"; exit 1; }
          done
          [ -s "$home/run/initial_password" ] || { echo "no bootstrap password file"; find "$home"; exit 1; }
          [ -s "$home/ssl/console_cert.pem" ] || { echo "certificate not under the home"; find "$home"; exit 1; }
          kill -TERM $pid
          for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 0.5; done
          if kill -0 $pid 2>/dev/null; then echo "did not exit on SIGTERM"; exit 1; fi
          echo "smoke test: started, generated its certificate, served the console, logged in, exited on SIGTERM"
          echo "--- layout ---"; find "$home" -maxdepth 2 | sed "s|$home|REMGR_HOME|"

      - name: The systemd unit is valid (Linux service glue)
        if: runner.os == 'Linux'
        run: |
          # The Linux counterpart of rc.d + login.conf.d, shipped in the repo so a
          # deployment does not have to invent it: the unit carries Restart=always
          # (the watchdog's job on OpenBSD, native here), LimitNOFILE=1024 (the
          # login-class lesson) and the filesystem hardening that stands in for
          # unveil. `systemd-analyze verify` parses it and checks that ExecStart is
          # an existing executable, so the built binary is installed first — that is
          # also what a real deployment does.
          sudo install -m 755 target/release/remgr /usr/local/bin/remgr
          sudo install -m 644 scripts/systemd/remgr.service /etc/systemd/system/remgr.service
          systemd-analyze verify /etc/systemd/system/remgr.service
          echo "systemd unit: parsed and verified"
          systemctl cat remgr >/dev/null 2>&1 || true
          # the properties the unit promises, checked against systemd's own view
          systemd-analyze security --offline=true /etc/systemd/system/remgr.service 2>/dev/null | tail -3 || true

      - name: The Npcap imports are delay-loaded (so the binary starts without it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The dependency is real — pnet_sys links Npcap's import library for
          # EasyTier's faketcp netfilter — but remgr/build.rs marks Packet.dll and
          # wpcap.dll as delay-loaded, so the Windows loader does NOT resolve them
          # before main() runs.
          #
          # This runner has no Npcap installed, which makes `--version` the decisive
          # test: before delay-loading it exited with 0xC0000135
          # (STATUS_DLL_NOT_FOUND); now it has to print a version. That property is
          # what lets the relay manager run on Windows without a packet driver —
          # only the EasyTier *node* needs one, and the module says so in words if
          # it is missing.
          $exe = "target\release\remgr.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "remgr.exe --version exited $LASTEXITCODE — the Npcap import is not delay-loaded any more (see remgr/build.rs)"
          }
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($text -match 'Packet\.dll') {
            Write-Host "Packet.dll is still referenced (delay-load table) and --version ran on a runner without Npcap"
          } else {
            Write-Host "::notice::remgr.exe no longer references Packet.dll at all — upstream dropped the dependency, so the delay-load lines in remgr/build.rs can go"
          }

      - name: Smoke test — starts, serves the console, stops on request
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # This runs unconditionally now: the Npcap imports are delay-loaded (see
          # remgr/build.rs), so the binary starts on a runner without Npcap and
          # this is a real runtime check rather than a conditional one. It ends by
          # asking the daemon to stop the way a service wrapper that cannot send
          # Ctrl-C would — a `stop` file in the run directory — and asserts that
          # the graceful shutdown ran, which is the Windows half of the
          # cross-platform work (the unix half is SIGTERM).
          # The first boot mints a self-signed certificate and switches the
          # console to HTTPS, so curl -k is used. Windows ships curl.exe.
          # REMGR_HOME pins the whole layout to a scratch tree, which is what
          # proves the ported paths (ProgramData/lib, run, log) work here.
          # NB: not `$home` — PowerShell's $HOME is a read-only automatic variable.
          $runRoot = Join-Path $env:RUNNER_TEMP "remgr-win"
          New-Item -ItemType Directory -Force -Path $runRoot | Out-Null
          $env:REMGR_HOME = $runRoot

          .\target\release\remgr.exe --version

          @"
          [console]
          port = 9443
          username = "admin"
          password_hash = ""
          session_ttl = 604800

          [easytier]
          enabled = false

          [stun_turn]
          enabled = false

          [rustdesk]
          enabled = false

          [frps]
          enabled = false

          [frpc]
          enabled = false
          "@ | Set-Content -Path (Join-Path $runRoot 'config.toml') -Encoding ascii

          $p = Start-Process -FilePath .\target\release\remgr.exe `
                 -ArgumentList '--config', (Join-Path $runRoot 'config.toml') `
                 -PassThru -RedirectStandardOutput (Join-Path $runRoot 'out.log') `
                 -RedirectStandardError (Join-Path $runRoot 'err.log')
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($p.HasExited) { throw "process died early (exit $($p.ExitCode))" }
              # NUL, not $null: PowerShell 7 passes $null to a native command as an
              # EMPTY argument, so `curl.exe -o $null` fails with "Failed to open
              # the file ''" and this loop would never see a working console.
              & curl.exe -kfs -o NUL 'https://127.0.0.1:9443/' 2>$null
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) {
              Write-Host "--- the daemon's log ---"
              Get-Content (Join-Path $runRoot 'out.log') -ErrorAction SilentlyContinue | Select-Object -Last 25
              Write-Host "--- its stderr ---"
              Get-Content (Join-Path $runRoot 'err.log') -ErrorAction SilentlyContinue | Select-Object -Last 25
              throw "console never came up"
            }

            $body = '{"username":"admin","password":"admin"}'
            $code = & curl.exe -ks -o NUL -w '%{http_code}' -X POST 'https://127.0.0.1:9443/api/login' `
                      -H 'content-type: application/json' -d $body
            if ($code -ne '200') { throw "login returned $code" }

            $log = Get-Content -Raw (Join-Path $runRoot 'out.log')
            if ($log -notmatch 'installed the default login admin') { throw "no default login in the log" }
            if ($log -notmatch 'generated a P-384 self-signed certificate') { throw "no first-boot certificate" }
            foreach ($d in @('', 'ssl', 'log', 'run')) {
              $sub = Join-Path $runRoot $d
              if (-not (Test-Path $sub)) { throw "missing $sub" }
            }
            if (-not (Test-Path (Join-Path $runRoot 'run\initial_password'))) { throw "no bootstrap password file" }
            if (-not (Test-Path (Join-Path $runRoot 'ssl\console_cert.pem'))) { throw "certificate not under the run root" }

            Write-Host "windows smoke test: started, generated its certificate, served the console, logged in"

            # Graceful stop on request: the same thing Ctrl-C (or NSSM's "Console"
            # stop method) asks for, spelled as a file so any wrapper can do it.
            New-Item -ItemType File -Force -Path (Join-Path $runRoot 'run\stop') | Out-Null
            $stopped = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($p.HasExited) { $stopped = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $stopped) { throw "the stop file did not stop the daemon within 10s" }
            $log = Get-Content -Raw (Join-Path $runRoot 'out.log')
            if ($log -notmatch 'stop file .* found and removed') { throw "no stop-file line in the log" }
            if ($log -notmatch 'stopped; exiting') { throw "the daemon exited without running its shutdown (exit code $($p.ExitCode))" }
            Write-Host "graceful stop on request: the daemon stopped itself, logged it and exited cleanly"

            Get-ChildItem -Recurse $runRoot | Select-Object -First 12 FullName | Format-Table -AutoSize
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      # Two builds of the same commit must produce the same bytes, or a release
      # asset stops being the thing this run verified. `--locked` pins the
      # dependency graph and the toolchain step above pins the compiler; this
      # prints the rest of the fingerprint, so a deployment comparing a locally
      # built binary against the release can see which axis moved rather than
      # guessing why the hashes differ.
      #
      # Nice-to-have provenance only: every lookup is optional and must never
      # fail the build. The prerequisite variables differ per platform (PROTOC
      # is set by the Windows step alone), so nothing here may assume one is
      # present -- `& $env:PROTOC` with an empty variable is a hard error in
      # PowerShell, which is exactly how this step broke the Linux job once.
      - name: Record what the binary was built from
        shell: pwsh
        run: |
          function Try-Version([string]$exe, [string]$fallback = 'not set') {
            if (-not $exe) { return $fallback }
            if (-not (Test-Path $exe)) { return "$fallback ($exe)" }
            try { return (& $exe --version 2>$null | Select-Object -First 1) } catch { return "$fallback ($exe)" }
          }

          $host_ = (rustc -vV | Select-String '^host:').Line -replace '^host:\s*', ''

          $clang = 'not set'
          if ($env:LIBCLANG_PATH) {
            $dll = Join-Path $env:LIBCLANG_PATH 'libclang.dll'
            $clang = if (Test-Path $dll) { (Get-Item $dll).VersionInfo.FileVersion } else { $env:LIBCLANG_PATH }
          }

          Write-Host '=== build fingerprint ==='
          Write-Host "commit     : $(git rev-parse HEAD)"
          Write-Host "rustc      : $(rustc --version)"
          Write-Host "cargo      : $(cargo --version)"
          Write-Host "host       : $host_"
          Write-Host "workspace  : $(Get-Location)"
          Write-Host "CARGO_HOME : $env:CARGO_HOME"
          Write-Host "libclang   : $clang"
          Write-Host "protoc     : $(Try-Version $env:PROTOC)"
          Write-Host ''
          Write-Host 'Pinning the toolchain and the dependency graph makes the build'
          Write-Host 'predictable, not byte-identical: link.exe stamps the link time into'
          Write-Host 'the PE header and rustc does not pass /Brepro, so two runs of the'
          Write-Host 'same commit differ by that field alone. What is guaranteed is that'
          Write-Host 'the published asset is the exact binary this run built and tested'
          Write-Host '-- verify a download against SHA256SUMS and deploy that asset.'

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: remgr-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30

  # Publish a release from a green run: a rolling `latest` from master (and from a
  # manual run), a versioned release from a `v*` tag. The assets are the binaries CI
  # just built and verified.
  #
  # Runs only when every job above is green and only for the refs that can produce a
  # shippable build: a push to master/main, a pushed `v*` tag, or a manual
  # workflow_dispatch. Never for a pull request -- an unreviewed branch must not be
  # able to publish over `latest`.
  #
  # The rolling tag is *moved* to the built commit before the release is written.
  # Without that, `latest` keeps pointing at whichever commit first created it, so
  # `git checkout latest` gives a tree that no longer matches the assets or the body
  # ("build <sha>") the release advertises.
  #
  # OpenBSD is the sanctioned platform and is built in a VM by the job above, so all
  # three assets are produced by the same run and attached by the same step -- there
  # is no longer a "attach it by hand afterwards" left open. That gap is exactly how
  # the OpenBSD asset disappeared from the release: the clear step below removes
  # every asset it finds, and a manual attachment that nobody repeated was removed
  # with the rest. scripts/publish-openbsd-release.sh is kept for repairing a release
  # by hand, not as the normal path.
  release:
    name: publish the release
    needs: [build, openbsd-build, console, hygiene]
    # `success()` is spelled out on purpose: a custom `if` on a job with `needs`
    # REPLACES the implicit "all dependencies succeeded" check, so without it this
    # job would happily publish over `latest` from a run whose tests failed.
    if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect the binaries CI built
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Is this a versioned release or the rolling one?
        id: kind
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "versioned=true"  >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "this run publishes versioned tag ${GITHUB_REF#refs/tags/}"
          else
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            echo "tag=latest"       >> "$GITHUB_OUTPUT"
            echo "this run publishes the rolling latest tag"
          fi
          echo "ref=$GITHUB_REF  sha=$GITHUB_SHA"

      # The tag has to point at what was built, or `latest` is a moving name for a
      # fixed old tree. Force-moved only for the rolling tag: a versioned `v*` tag is
      # the operator's own and is never touched.
      - name: Move the rolling latest tag to the built commit
        if: steps.kind.outputs.versioned == 'false'
        run: |
          set -eu
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          echo "latest -> $(git rev-parse --short latest)"

      - name: Name them, checksum them, describe them
        id: pack
        run: |
          set -eu
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sha=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)
          mkdir -p out
          cp dist/remgr-linux-x86_64/remgr        out/remgr-linux-x86_64
          cp dist/remgr-windows-x86_64/remgr.exe  out/remgr-windows-x86_64.exe
          cp dist/remgr-openbsd-amd64/remgr       out/remgr-openbsd-amd64
          # one file covering all three, checked in the step below
          (cd out && sha256sum remgr-* > SHA256SUMS)
          {
            echo "ReMgr $ver — build $sha"
            echo
            echo "$subject"
            echo
            echo "| platform | asset | notes |"
            echo "|---|---|---|"
            echo "| Linux x86_64 | remgr-linux-x86_64 | service unit: scripts/systemd/remgr.service |"
            echo "| Windows x86_64 | remgr-windows-x86_64.exe | starts without Npcap; only the EasyTier node needs wintun + Npcap |"
            echo "| OpenBSD amd64 | remgr-openbsd-amd64 | built in an OpenBSD VM by this run, with scripts/openbsd-build.sh |"
            echo
            echo "Built and verified by CI on GitHub-hosted runners: all three platforms"
            echo "compile, the Linux and Windows jobs run their unit tests, and a runtime"
            echo "smoke test starts the service, serves the console over HTTPS, then stops it"
            echo "again — on Windows through the stop file, which is the graceful-stop path"
            echo "when no console control event is available."
            echo
            echo "The OpenBSD binary is built on OpenBSD (in a QEMU VM, since GitHub has no"
            echo "OpenBSD runner) and the VM run starts it before uploading, so it links"
            echo "against the system libc there rather than a Linux or Windows shim."
            echo
            echo "Not verified here: behaviour that needs a real client on the far end (EasyTier"
            echo "TUN networking, RustDesk clients, upstream frpc interop) is measured on OpenBSD"
            echo "only. See the support table in the README."
            echo
            echo "Reproducibility: the compiler is pinned (\`toolchain: 1.99.0\`) and the"
            echo "dependency graph is locked (\`--locked\`), which makes the build predictable"
            echo "rather than byte-identical -- link.exe stamps the link time into the PE"
            echo "header and rustc does not pass \`/Brepro\`, so two runs of one commit differ"
            echo "by that field alone. What is guaranteed is that these assets are the exact"
            echo "binaries this run built and smoke-tested: verify a download against"
            echo "\`SHA256SUMS\` and deploy the asset you verified, rather than comparing it"
            echo "with a binary built on another machine."
          } > body.md
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ls -l out

      # The clear step below deletes every asset the release holds, so anything that
      # is supposed to survive has to be re-uploaded by this run. Refusing to go on
      # without all three is what keeps a missing asset from turning into a silently
      # incomplete release: it is exactly how remgr-openbsd-amd64 vanished -- a
      # manual attachment, deleted by a later publish, never re-attached.
      - name: Every platform must be present before anything is deleted
        run: |
          set -eu
          for f in remgr-linux-x86_64 remgr-windows-x86_64.exe remgr-openbsd-amd64 SHA256SUMS; do
            [ -s "out/$f" ] || { echo "out/$f is missing or empty — refusing to publish"; exit 1; }
          done
          echo "all four files present:"
          cat out/SHA256SUMS

      - name: Clear the previous publish's assets (nothing stale may survive)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${{ steps.kind.outputs.tag }}"
          ids=$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.assets[].id' 2>/dev/null || true)
          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" >/dev/null || true
          done
          echo "cleared: ${ids:-none}"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.kind.outputs.tag }}
          name: ${{ steps.kind.outputs.versioned == 'true' && format('ReMgr {0}', steps.kind.outputs.tag) || 'ReMgr — latest master build' }}
          body_path: body.md
          files: |
            out/remgr-linux-x86_64
            out/remgr-windows-x86_64.exe
            out/remgr-openbsd-amd64
            out/SHA256SUMS
          fail_on_unmatched_files: true
