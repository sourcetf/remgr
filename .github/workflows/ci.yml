# CI for ReMgr.
#
# ReMgr is developed for OpenBSD (it need(2)s pledge/unveil), and GitHub has no
# OpenBSD runner, so the *sanctioned* platform cannot be built here — a green run
# does not mean the OpenBSD daemon compiled. Everything that can be verified on
# Linux/Windows is:
#
#   1. `remgr-frps` — the frp wire-protocol implementation (server + client) —
#      builds and its unit tests pass. Deliberately platform-independent, which
#      `scripts/check-repo.sh` enforces, because that is what makes this possible.
#   2. The web console — its one inline script parses, every handler used by an
#      inline attribute exists, every widget kind has a renderer, and every
#      endpoint it calls exists in the router.
#   3. Repository hygiene — no credentials/keys/logs/build output tracked.
#   4. **Linux and Windows release builds of the whole service**, plus a runtime
#      smoke test on Linux: start it against a scratch `REMGR_HOME`, fetch the
#      console over HTTP, and shut it down with SIGTERM. That is what proves the
#      portability layer actually works rather than merely compiling.
#
# Both platform builds need LLVM: `kcp-sys` (via EasyTier) and `machine-uid` (via
# the RustDesk server) run bindgen at build time, which loads libclang.
#
# Deployment on OpenBSD (build + install + rcctl) stays manual; see the README
# and `scripts/preflight.sh`.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # the dependency tree is large; a cold release build is the slowest step
  CARGO_BUILD_JOBS: 4
  # Vendored EasyTier patches use `#![feature(cfg_select)]`, which stable rustc
  # refuses (the feature is only stable since 1.95, and the attribute is an error
  # either way). This is the same variable the OpenBSD build documents in
  # scripts/openbsd-build.sh; ReMgr's own code does not need it.
  RUSTC_BOOTSTRAP: "1"

jobs:
  frp-protocol:
    name: frp protocol crate (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # only this crate is compiled, so cache what it needs
          workspaces: remgr-frps

      - name: The workspace resolves (Cargo.lock is in sync)
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check (all targets, warnings are visible)
        run: cargo check --locked -p remgr-frps --all-targets

      - name: Build (release, as shipped)
        run: cargo build --locked --release -p remgr-frps

      - name: Tests (framing, crypto reference vectors, udp/tcp tunnels, config)
        run: cargo test --locked --release -p remgr-frps

      - name: Build the interop harness (examples/frpc_probe)
        run: cargo build --locked --release -p remgr-frps --example frpc_probe

      - name: The self-test inside the harness
        run: ./target/release/examples/frpc_probe --self-test

  console:
    name: web console checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node is preinstalled on the runners, so the script's syntax check runs
      # (it is skipped with a warning where node is absent, e.g. a bare host).
      - name: Console SPA (script parses, handlers, widgets, endpoints)
        run: sh scripts/check-console.sh remgr/src/console/assets/index.html remgr/src/console/mod.rs

      - name: Shell scripts parse
        run: |
          set -e
          for f in scripts/*.sh scripts/rc.d/remgr; do
            [ -f "$f" ] || continue
            sh -n "$f"
            echo "ok    $f"
          done

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh scripts/check-repo.sh

  build:
    name: release build (${{ matrix.name }})
    needs: [frp-protocol]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: remgr
          - name: windows-x86_64
            os: windows-latest
            binary: remgr.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build prerequisites (LLVM for bindgen, protoc for the protobuf codegen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang:      kcp-sys (EasyTier) and machine-uid (RustDesk) run bindgen
          # protoc:        the pros* crates generate EasyTier's protobuf types
          # libprotobuf-dev: the .proto files protoc imports, google/protobuf/*
          sudo apt-get install -y --no-install-recommends libclang-dev llvm protobuf-compiler libprotobuf-dev
          libclang=$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' | head -1)
          [ -n "$libclang" ] || { echo "libclang.so not found — libclang-dev did not install"; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          wkt=$(dpkg -L libprotobuf-dev | grep -m1 'google/protobuf/timestamp.proto$' || true)
          [ -n "$wkt" ] || { echo "libprotobuf-dev does not ship the well-known .proto files"; exit 1; }
          # protoc's -I root is three levels above the file (…/<inc>/google/protobuf/timestamp.proto)
          inc=$(dirname "$(dirname "$(dirname "$wkt")")")
          echo "PROTOC_INCLUDE=$inc" >> "$GITHUB_ENV"
          echo "protoc: $(protoc --version), includes: $inc"

      - name: Verify the prerequisites actually work
        if: runner.os == 'Linux'
        run: |
          # A one-line probe: if protoc cannot resolve the well-known types here,
          # the real build fails 20 minutes later with the same message buried in
          # the dependency output. Fail now instead.
          cat > /tmp/probe.proto <<'EOF'
          syntax = "proto3";
          package probe;
          import "google/protobuf/timestamp.proto";
          message Probe { google.protobuf.Timestamp at = 1; }
          EOF
          protoc -I /tmp -o /dev/null /tmp/probe.proto
          echo "protoc resolves google/protobuf/timestamp.proto"

      - name: Install build prerequisites (LLVM for bindgen, protoc for the protobuf codegen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest ships neither a libclang cargo can find nor protoc
          choco install llvm protoc --no-progress -y
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $llvm "libclang.dll"))) { throw "libclang.dll missing in $llvm" }

          # Find the *real* protoc, not the chocolatey shim in ...\chocolatey\bin:
          # deriving the include directory from the shim lands in the wrong place.
          $protoc = Get-ChildItem "C:\ProgramData\chocolatey\lib\protoc" -Recurse -Filter protoc.exe -ErrorAction SilentlyContinue |
                      Select-Object -First 1
          if (-not $protoc) { throw "protoc.exe not found under chocolatey\lib\protoc" }

          # Derive the include root from the well-known file itself, which is what
          # protoc has to resolve, rather than guessing a directory layout.
          $wkt = Get-ChildItem (Join-Path $protoc.DirectoryName "..") -Recurse -Filter timestamp.proto -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'google\\protobuf\\timestamp\.proto$' } |
                   Select-Object -First 1
          if (-not $wkt) { throw "google/protobuf/timestamp.proto not found beside $($protoc.FullName)" }
          $inc = Split-Path (Split-Path (Split-Path $wkt.FullName -Parent) -Parent) -Parent

          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvm"
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$($protoc.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC_INCLUDE=$inc"
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
          Add-Content -Path $env:GITHUB_PATH -Value $protoc.DirectoryName
          & $protoc.FullName --version
          Write-Host "protoc: $($protoc.FullName), includes: $inc"

      - name: Verify the prerequisites actually work
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # see the Linux probe above: fail here rather than in the dependency build
          $probe = Join-Path $env:RUNNER_TEMP "probe.proto"
          @'
          syntax = "proto3";
          package probe;
          import "google/protobuf/timestamp.proto";
          message Probe { google.protobuf.Timestamp at = 1; }
          '@ | Set-Content -Path $probe -Encoding ascii
          $out = Join-Path $env:RUNNER_TEMP "probe.out"
          & protoc -I $env:RUNNER_TEMP -o $out $probe
          if ($LASTEXITCODE -ne 0) { throw "protoc could not resolve the well-known types" }
          Write-Host "protoc resolves google/protobuf/timestamp.proto"

      - uses: Swatinem/rust-cache@v2

      - name: Build the service (release, as shipped)
        run: cargo build --locked --release -p remgr

      - name: The frp crate's tests, on this platform
        run: cargo test --locked --release -p remgr-frps

      - name: Smoke test — start, serve the console, shut down cleanly
        if: runner.os == 'Linux'
        run: |
          set -eu
          home=$(mktemp -d)
          # every module off, so this test is only about the process coming up,
          # generating its first-boot certificate, finding its directories and
          # stopping on SIGTERM. The console is left at the default 9443 so the
          # port check matches what the docs promise; -k is used for its
          # self-signed first-boot certificate (which this also exercises —
          # certificate generation is filesystem work that the port has to get right).
          cat > "$home/config.toml" <<EOF
          [console]
          port = 9443
          username = "admin"
          password_hash = ""
          session_ttl = 604800

          [easytier]
          enabled = false

          [stun_turn]
          enabled = false

          [rustdesk]
          enabled = false

          [frps]
          enabled = false

          [frpc]
          enabled = false
          EOF
          REMGR_HOME="$home" ./target/release/remgr --config "$home/config.toml" > "$home/out.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if curl -kfs -o /dev/null "https://127.0.0.1:9443/"; then break; fi
            if ! kill -0 $pid 2>/dev/null; then echo "process died early:"; cat "$home/out.log"; exit 1; fi
            sleep 0.5
          done
          curl -kfs -o /dev/null "https://127.0.0.1:9443/" || { echo "console did not serve"; cat "$home/out.log"; exit 1; }
          code=$(curl -ks -o /dev/null -w '%{http_code}' -X POST "https://127.0.0.1:9443/api/login" \
                   -H 'content-type: application/json' -d '{"username":"admin","password":"admin"}')
          [ "$code" = "200" ] || { echo "login returned $code"; cat "$home/out.log"; exit 1; }
          grep -q "installed the default login admin" "$home/out.log" || { echo "no default login in the log"; cat "$home/out.log"; exit 1; }
          grep -q "generated a P-384 self-signed certificate" "$home/out.log" || { echo "no first-boot certificate"; cat "$home/out.log"; exit 1; }
          # the whole layout must be under REMGR_HOME, certificates included
          for d in "" /ssl /log /run; do
            [ -d "$home$d" ] || { echo "missing $home$d"; find "$home"; exit 1; }
          done
          [ -s "$home/run/initial_password" ] || { echo "no bootstrap password file"; find "$home"; exit 1; }
          [ -s "$home/ssl/console_cert.pem" ] || { echo "certificate not under the home"; find "$home"; exit 1; }
          kill -TERM $pid
          for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 0.5; done
          if kill -0 $pid 2>/dev/null; then echo "did not exit on SIGTERM"; exit 1; fi
          echo "smoke test: started, generated its certificate, served the console, logged in, exited on SIGTERM"
          echo "--- layout ---"; find "$home" -maxdepth 2 | sed "s|$home|REMGR_HOME|"

      - name: Smoke test — it starts, serves the console and reports its layout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The first boot mints a self-signed certificate and switches the
          # console to HTTPS, so curl -k is used. Windows ships curl.exe.
          # REMGR_HOME pins the whole layout to a scratch tree, which is what
          # proves the ported paths (ProgramData/lib, run, log) work here.
          $home = Join-Path $env:RUNNER_TEMP "remgr-win"
          New-Item -ItemType Directory -Force -Path $home | Out-Null
          $env:REMGR_HOME = $home

          .\target\release\remgr.exe --version

          @"
          [console]
          port = 9443
          username = "admin"
          password_hash = ""
          session_ttl = 604800

          [easytier]
          enabled = false

          [stun_turn]
          enabled = false

          [rustdesk]
          enabled = false

          [frps]
          enabled = false

          [frpc]
          enabled = false
          "@ | Set-Content -Path (Join-Path $home 'config.toml') -Encoding ascii

          $p = Start-Process -FilePath .\target\release\remgr.exe `
                 -ArgumentList '--config', (Join-Path $home 'config.toml') `
                 -PassThru -RedirectStandardOutput (Join-Path $home 'out.log') `
                 -RedirectStandardError (Join-Path $home 'err.log')
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($p.HasExited) { throw "process died early (exit $($p.ExitCode))" }
              & curl.exe -kfs -o $null 'https://127.0.0.1:9443/' 2>$null
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) { throw "console never came up" }

            $body = '{"username":"admin","password":"admin"}'
            $code = & curl.exe -ks -o $null -w '%{http_code}' -X POST 'https://127.0.0.1:9443/api/login' `
                      -H 'content-type: application/json' -d $body
            if ($code -ne '200') { throw "login returned $code" }

            $log = Get-Content -Raw (Join-Path $home 'out.log')
            if ($log -notmatch 'installed the default login admin') { throw "no default login in the log" }
            if ($log -notmatch 'generated a P-384 self-signed certificate') { throw "no first-boot certificate" }
            foreach ($d in @('', 'ssl', 'log', 'run')) {
              $p2 = Join-Path $home $d
              if (-not (Test-Path $p2)) { throw "missing $p2" }
            }
            if (-not (Test-Path (Join-Path $home 'run\initial_password'))) { throw "no bootstrap password file" }
            if (-not (Test-Path (Join-Path $home 'ssl\console_cert.pem'))) { throw "certificate not under the home" }

            Write-Host "windows smoke test: started, generated its certificate, served the console, logged in"
            Get-ChildItem -Recurse $home | Select-Object -First 12 FullName | Format-Table -AutoSize
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: remgr-${{ matrix.name }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30