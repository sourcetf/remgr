[workspace]
resolver = "2"
members = ["remgr", "remgr-frps"]
# vendored upstream trees carry their own workspaces
exclude = ["third_party"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
futures-util = "0.3"
async-trait = "0.1"
rand = "0.8"
socket2 = "0.5"
tokio-util = { version = "0.7", features = ["rt"] }

# OpenBSD support patches vendored from the EasyTier-OpenBSD port
# (rust-tun openbsd backend, boringtun CLOCK_MONOTONIC, guarden cfg_select)
[patch.crates-io]
guarden = { path = "third_party/easytier/patches/guarden" }
boringtun-easytier = { path = "third_party/easytier/patches/boringtun-easytier" }

[patch."https://github.com/EasyTier/rust-tun"]
tun-easytier = { path = "third_party/easytier/patches/rust-tun" }

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 2
strip = true
