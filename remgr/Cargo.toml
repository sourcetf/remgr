[package]
name = "remgr"
description = "ReMgr - all-in-one relay manager for OpenBSD: EasyTier center (easytier-web embedded), STUN/TURN, RustDesk relay, frps"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "remgr"
path = "src/main.rs"

[features]
default = []

[dependencies]
remgr-frps = { path = "../remgr-frps" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
log.workspace = true
libc.workspace = true
futures-util.workspace = true
async-trait.workspace = true
rand.workspace = true

axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
# loopback client for the /et reverse proxy to the embedded easytier-web API
reqwest = { version = "0.12", default-features = false }

uuid = { version = "1", features = ["v4"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = "0.13"
time = { version = "0.3", features = ["parsing", "formatting"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tokio-util = { workspace = true, features = ["rt"] }
url = "2"

# ---- integrated services (in-process libraries, no subprocesses, no IPC) ----
easytier = { path = "../third_party/easytier/easytier", default-features = false, features = ["full", "management", "management-rpc"] }
easytier-web = { path = "../third_party/easytier/easytier-web", default-features = false, features = ["embed"] }
password-auth = "1.0.0"
# RustDesk hbbs/hbbr as a library (vendored rustdesk-server 1.1.17)
hbbs = { path = "../third_party/rustdesk-server" }
# TURN relay (pure Rust, RFC 5766); `metrics` exposes per-allocation byte counters
turn = { version = "0.17", features = ["metrics"] }
util = { package = "webrtc-util", version = "0.17", default-features = false, features = ["conn", "vnet"] }
