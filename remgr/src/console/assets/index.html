<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReMgr — Relay Manager Console</title>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2330;--border:#30363d;
  --tx:#e6edf3;--tx2:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}
/* login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#login .box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:36px;width:340px}
#login h1{font-size:20px;margin-bottom:6px;text-align:center}
#login p{color:var(--tx2);font-size:12px;text-align:center;margin-bottom:20px}
input,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--tx);font-size:13px;outline:none}
input:focus{border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:#fff;background:var(--bg3);transition:filter .15s}
.btn:hover{filter:brightness(1.2)}
.btn.primary{background:var(--blue)}.btn.success{background:var(--green)}.btn.danger{background:var(--red)}.btn.warn{background:var(--yellow)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* layout */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 22px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:10}
header .logo{font-weight:700;font-size:16px}
header .logo span{color:var(--blue)}
nav{display:flex;gap:2px;height:100%}
nav button{background:none;border:none;color:var(--tx2);padding:0 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;height:100%}
nav button.active{color:var(--tx);border-bottom-color:var(--blue)}
#conn{font-size:12px;color:var(--tx2)}
#conn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px}
#conn.ok .dot{background:var(--green)}
main{max-width:1180px;margin:0 auto;padding:22px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.card h3{font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kv{background:var(--bg3);border-radius:7px;padding:10px}
.kv .l{font-size:11px;color:var(--tx2);margin-bottom:3px}
.kv .v{font-size:14px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.kv.warn .l{color:var(--yellow)}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.badge.run{background:rgba(63,185,80,.15);color:var(--green)}
.badge.stop{background:rgba(248,81,73,.15);color:var(--red)}
.badge.warn{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge.off{background:rgba(139,148,158,.15);color:var(--tx2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.switch{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
th{color:var(--tx2);font-weight:500}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:22px;width:620px;max-width:92vw;max-height:86vh;overflow-y:auto}
#modal h3{margin-bottom:16px;font-size:15px}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:11px;color:var(--tx2);margin-bottom:4px}
.fg .hint{font-size:10px;color:var(--tx2);margin-top:3px}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* logs */
#logs{background:#0a0d12;border:1px solid var(--border);border-radius:8px;padding:12px;height:340px;overflow-y:auto;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all}
/* toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 17px;border-radius:8px;font-size:13px;color:#fff;animation:slide .25s ease}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:720px){nav{overflow-x:auto}.fg-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>⚙ ReMgr</h1>
    <p>Relay Manager Console</p>
    <div class="fg"><input type="text" id="login-user" placeholder="用户名" autocomplete="username"
      onkeydown="if(event.key==='Enter')el('login-pw').focus()"></div>
    <div class="fg"><input type="password" id="login-pw" placeholder="密码" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn primary" id="login-btn" style="width:100%" onclick="doLogin()">登录</button>
    <p id="login-err" style="color:var(--red);margin-top:12px;min-height:14px"></p>
    <p style="margin-bottom:0">初始账户为 <code>admin</code> / <code>admin</code>（口令首次启动也会写入
      <code>/var/run/remgr/initial_password</code>），登录后请在「系统」页修改。</p>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="logo">⚙ <span>ReMgr</span></div>
  <nav id="nav"></nav>
  <div id="conn"><span class="dot"></span><span id="conn-tx">…</span>
    <button class="btn sm" style="margin-left:10px" onclick="doLogout()">退出</button></div>
</header>
<main>
  <div id="tab-dashboard"></div>
  <div id="tab-easytier" class="hidden"></div>
  <div id="tab-stun_turn" class="hidden"></div>
  <div id="tab-rustdesk" class="hidden"></div>
  <div id="tab-frps" class="hidden"></div>
  <div id="tab-frpc" class="hidden"></div>
  <div id="tab-system" class="hidden">
    <div class="card">
      <h3>🔧 控制台设置</h3>
      <div class="grid" id="console-form"></div>
      <div class="row">
        <button class="btn primary" id="console-save" onclick="saveConsole()">保存</button>
        <button class="btn warn" id="console-apply" onclick="applyConsole()">立即应用（重新绑定）</button>
        <button class="btn" onclick="genCert('console')">🔐 生成控制台证书</button>
        <button class="btn" onclick="uploadCert('console')">📥 上传控制台证书</button>
      </div>
      <div class="hint">端口/TLS 的改动需点「立即应用」重新绑定控制台；证书路径默认指向 <code>/etc/remgr/ssl</code>。
        端口须为 1-65535 的整数，会话有效期为正整数（秒）。
        若启用了 HTTPS 但证书不可读，控制台会退回 HTTP 以免失联（届时上方「应用后地址」只是配置值，实际以浏览器地址栏为准）。</div>
    </div>
    <div class="card">
      <h3>🔑 修改控制台密码</h3>
      <div class="row">
        <input id="pw-old" type="password" placeholder="当前密码" style="max-width:200px">
        <input id="pw-new" type="password" placeholder="新密码（至少 4 位）" style="max-width:240px">
        <button class="btn primary" onclick="changePassword()">修改</button>
      </div>
    </div>
    <div class="card">
      <h3>📜 日志</h3>
      <div id="logs"></div>
      <div class="row"><label class="switch"><input type="checkbox" id="log-follow" checked> 实时跟随</label>
        <button class="btn sm" onclick="downloadLogs()">⬇ 下载日志</button></div>
    </div>
  </div>
</main>
</div>

<div id="modal" class="hidden"><div class="box">
  <h3 id="modal-title"></h3>
  <div id="modal-body"></div>
  <div class="row" style="justify-content:flex-end;margin-top:16px">
    <button class="btn" onclick="closeModal()">取消</button>
    <button class="btn primary" onclick="saveModal()">保存</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
"use strict";
const API = {
  get: (p) => fetch(p, {headers: {'x-remgr-csrf':'1'}}),
  send: (p, method, body) => fetch(p, {method, headers:{'Content-Type':'application/json','x-remgr-csrf':'1'}, body: body!==undefined?JSON.stringify(body):undefined}),
};
const TITLES = {easytier:'⚡ EasyTier 中心', stun_turn:'🌐 STUN / TURN', rustdesk:'🖥 RustDesk 中继', frps:'📡 frps 反向代理', frpc:'🔌 frpc 客户端'};
let status=null, configs={}, curTab='dashboard', editService=null, loggingIn=false;
let ws=null, wsTimer=null, wsFails=0, logTimer=null, lastLogText=null, logErrShown=false;

/* ---------- helpers ---------- */
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
/// Escape a value before it goes into innerHTML — text *and* quoted attributes.
/// Server data (network names, db/certificate paths, error strings) and names
/// chosen by *remote* frpc clients (frps proxy names) may contain <, & or
/// quotes; unescaped they would break the markup or run script in this session.
function esc(v){ return String(v??'').replace(/[&<>"']/g, c=>ESC_MAP[c]) }
/// null / undefined / "" render as "—" instead of an empty cell.
function val(v){ return (v===undefined||v===null||v==='')?'—':v }
function el(id){ return document.getElementById(id) }
function toast(msg, ok=true){
  const t=document.createElement('div');t.className='toast '+(ok?'ok':'err');t.textContent=msg;
  el('toast').appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}
async function api(p, method, body, opt){
  const r = method ? await API.send(p, method, body) : await API.get(p);
  // 401 normally means the session is gone, so the overlay comes back. Two calls
  // use it for "these credentials are wrong" instead (login, change-password):
  // they pass `noRelogin` so the server's message reaches the operator rather
  // than being replaced by "未登录".
  if(r.status===401 && !(opt&&opt.noRelogin)){showLogin();throw new Error('未登录')}
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
function connState(ok, text){
  el('conn').classList.toggle('ok', !!ok);
  el('conn-tx').textContent=text;
}
/// Click-to-select for a read-only copy field. A named handler rather than
/// `this.select()` inline, so the static handler checks see a defined function.
function selectText(input){ try{ input.select() }catch(e){} }

/* ---------- auth ---------- */
async function doLogin(){
  if(loggingIn) return;
  loggingIn=true;
  const err=el('login-err'), btn=el('login-btn'), pw=el('login-pw').value, user=el('login-user').value;
  if(!user.trim()){ err.textContent='请输入用户名'; loggingIn=false; return }
  err.textContent=''; btn.disabled=true;
  try{
    await api('/api/login','POST',{username:user.trim(),password:pw},{noRelogin:true});
    // remember the user name only (never the password); it is not a secret
    try{ localStorage.setItem('remgr_user', user.trim()) }catch(e){}
    el('login').classList.add('hidden');
    el('app').classList.remove('hidden');
    boot().catch(e=>toast('初始化失败: '+(e&&e.message||e), false));
  }catch(e){err.textContent=e.message}
  finally{loggingIn=false;btn.disabled=false}
}
async function doLogout(){try{await api('/api/logout','POST')}catch(e){} location.reload()}
function showLogin(){
  el('login').classList.remove('hidden');el('app').classList.add('hidden');
  el('login-err').textContent='登录状态已失效，请重新登录。';
  if(wsTimer){clearTimeout(wsTimer);wsTimer=null}
}

/* ---------- boot ---------- */
async function boot(){
  buildNav(); switchTab('dashboard');
  await refreshAll();
  await refreshConsoleCfg();
  connectWS();
  if(logTimer) clearInterval(logTimer);
  logTimer = setInterval(tickLogs, 4000);
}
// Prefill the login form from what we remember, and focus the first empty field —
// the page may also be reached with a session that has since expired.
(function prefillLogin(){
  try{
    const u=localStorage.getItem('remgr_user');
    const uf=el('login-user'), pf=el('login-pw');
    if(uf && u) uf.value=u;
    const focus = (uf && !uf.value) ? uf : pf;
    if(focus) focus.focus();
  }catch(e){}
})();
let statusErrShown=false;
async function refreshAll(){
  try{
    status = await api('/api/status'); statusErrShown=false;
  }catch(e){
    // Keep the last known status on screen (a poll hiccup must not blank the
    // console), but say once that the figures on screen are the old ones.
    if(e.message!=='未登录' && !statusErrShown){ statusErrShown=true; toast('状态读取失败: '+e.message, false) }
    return;
  }
  render();
}
function buildNav(){
  const nav=el('nav');
  const tabs=[['dashboard','总览'],['easytier','EasyTier'],['stun_turn','STUN/TURN'],['rustdesk','RustDesk'],['frps','frps'],['frpc','frpc'],['system','系统']];
  nav.innerHTML=tabs.map(([id,label])=>`<button data-t="${id}" class="${id===curTab?'active':''}" onclick="switchTab('${id}')">${label}</button>`).join('');
}
function switchTab(t){
  curTab=t;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  for(const id of ['dashboard','easytier','stun_turn','rustdesk','frps','frpc','system'])
    el('tab-'+id).classList.toggle('hidden', id!==t);
  if(t==='system'){ scrollLogs(); refreshConsoleCfg() }
  render();
}

/* ---------- render ---------- */
let renderErrShown=false;
function render(){
  if(!status) return;
  try{
    renderDashboard(); renderServiceTabs();
  }catch(e){
    // a malformed payload must not leave the console blank with no explanation
    if(!renderErrShown){ renderErrShown=true; toast('界面渲染失败: '+e.message, false) }
    return;
  }
  if(curTab==='system') tickLogs();
}
function badge(run, enabled, warnText){
  if(enabled===false) return '<span class="badge off">已禁用</span>';
  if(warnText) return `<span class="badge warn">${esc(warnText)}</span>`;
  return run?'<span class="badge run">运行中</span>':'<span class="badge stop">已停止</span>';
}
// The center node is an EasyTier instance, which only exists while the module
// runs and only once it has a network to join. The server reports which of those
// is missing (`node_state`), so the console states the actual reason instead of
// guessing — a stopped module used to read as "缺少网络名称".
function nodeStateText(e){
  if(!e) return '—';
  switch(e.node_state){
    case 'running':   return e.node_name || '运行中';
    case 'off':       return '关闭';
    case 'disabled':  return '未启动（模块已禁用，点「启动」）';
    case 'stopped':   return '未启动（模块已停止，点「启动」）';
    case 'no_network':return '未启动（「网络名称」为空）';
    case 'failed':    return '未启动（实例未建立，见日志）';
  }
  // older server without node_state: fall back to the two facts it does send
  if(e.node_running) return e.node_name || '运行中';
  if(!e.node_enabled) return '关闭';
  return e.network_name ? '未启动（模块已停止，点「启动」）' : '未启动（「网络名称」为空）';
}
function fmtBytes(n){
  n=Number(n);
  if(!Number.isFinite(n)||n<0) return '—';
  if(n<1024) return n+' B';
  const u=['KB','MB','GB','TB'];let i=-1;
  do{n/=1024;i++}while(n>=1024&&i<u.length-1);
  return n.toFixed(1)+' '+u[i];
}
function kvCell(label, value){
  return `<div class="kv"><div class="l">${esc(label)}</div><div class="v">${esc(val(value))}</div></div>`;
}
function kvWarn(label, value){
  return `<div class="kv warn"><div class="l">${esc(label)}</div><div class="v">${esc(val(value))}</div></div>`;
}
function svcCard(name, running, enabled, kvs, extraButtons='', warnText=''){
  // A disabled module cannot be started by the checkbox path, but the server's
  // start action clears the flag itself — so 启动 stays clickable and the card
  // says what will happen instead of greying the button out silently.
  const note = enabled===false
    ? '<span class="hint" style="margin-left:6px">模块已禁用：点「启动」会自动重新启用它</span>' : '';
  return `<div class="card"><h3>${esc(TITLES[name])} ${badge(running,enabled,warnText)}</h3>
    <div class="grid">${kvs.map(([l,v])=>kvCell(l,v)).join('')}</div>
    <div class="row">
      <button class="btn success sm" onclick="svcAction('${name}','start')">▶ 启动</button>
      <button class="btn danger sm" onclick="svcAction('${name}','stop')">■ 停止</button>
      <button class="btn primary sm" onclick="openConfig('${name}')">⚙ 配置</button>
      ${extraButtons}
      <label class="switch"><input type="checkbox" ${enabled?'checked':''} onchange="toggleEnabled('${name}',this.checked)"> 开机启用</label>${note}
    </div></div>`;
}
function renderDashboard(){
  const s=status, sv=s.services||{}, c=s.console||{};
  const up=Number(s.uptime_s)||0, d=Math.floor(up/86400), h=Math.floor(up%86400/3600), m=Math.floor(up%3600/60);
  // `console.tls` is what the config asks for; TLS material that cannot be read
  // makes the server fall back to plaintext on the same port. Prefer the
  // server's `tls_active` when it reports it, otherwise the scheme this page was
  // actually served over is the truth for this session.
  const cfgTls=!!c.tls;
  const liveTls=(typeof c.tls_active==='boolean') ? c.tls_active : (location.protocol==='https:');
  const livePort=location.port||c.port||'—';
  const el0=el('tab-dashboard');
  let html=`<div class="card"><h3>🖥 系统</h3>
    <div class="grid">
      ${kvCell('版本','ReMgr '+s.version+' ('+s.os+')')}
      ${kvCell('运行时间',d+'天 '+h+'时 '+m+'分')}
      ${kvCell('控制台',(liveTls?'HTTPS':'HTTP')+' :'+livePort)}
      ${kvCell('在线 frps 客户端',sv.frps?.clients_online??0)}
      ${cfgTls&&!liveTls?kvWarn('⚠ HTTPS 未生效','已配置 HTTPS，但当前以 HTTP 提供服务：证书/私钥不可读或端口无法监听，详见日志；修好后点「系统 → 立即应用」'):''}
    </div></div>`;
  html += svcCard('easytier', sv.easytier?.running, sv.easytier?.enabled, [
    ['配置服务器端口', sv.easytier?.config_server_port],['API 端口', sv.easytier?.api_port],
    ['本地节点', nodeStateText(sv.easytier)],
    ['网络名', sv.easytier?.network_name],
  ]);
  const st=sv.stun_turn||{};
  html += svcCard('stun_turn', st.running, st.enabled, [
    ['STUN/TURN 端口', st.stun_port],['TLS 端口', val(st.tls_port)+(st.tls_active?' (监听中)':' (未启用)')],
    ['域名', st.domain],['中继端口范围', st.relay_ports],
    ['TURN 中继', st.turn_available===false?'未就绪':'可用'],
  ]);
  const rd=sv.rustdesk||{};
  html += svcCard('rustdesk', rd.running, rd.enabled, [
    ['中继端口 (hbbr)', rd.relay_port],['ID 端口 (hbbs)', rd.hbbs_port],
    ['服务器 Key', rd.key_set?'已设置':'未设置'],
  ]);
  const fp=sv.frps||{};
  html += svcCard('frps', fp.running, fp.enabled, [
    ['监听', fp.bind],['在线客户端', fp.clients_online],
    ['认证 Token', fp.token_set?'已设置':'未设置（任何客户端可登录）'],
    ['TLS 证书', fp.tls?'已配置':'使用临时自签证书'],
    ['入站流量', fmtBytes(fp.bytes_in||0)],['出站流量', fmtBytes(fp.bytes_out||0)],
  ]);
  const fc=sv.frpc||{};
  html += svcCard('frpc', fc.running&&fc.connected, fc.enabled, [
    ['上游', fc.upstream],['连接', fc.running?(fc.connected?'已连接':'连接中 / 重连中'):'未启动'],
    ['代理', (fc.proxies||[]).filter(p=>p.state==='running').length+' / '+(fc.proxies||[]).length+' 个运行中'],
    ['会话时长', (fc.session_uptime_s||0)+' 秒'],
    ['入站流量', fmtBytes(fc.bytes_in||0)],['出站流量', fmtBytes(fc.bytes_out||0)],
  ], '', fc.running&&!fc.connected?'运行中·未连接':'');
  el0.innerHTML=html;
}
function proxyTable(rows, cols, emptyText){
  if(!rows.length) return `<p style="color:var(--tx2);font-size:13px">${esc(emptyText)}</p>`;
  return `<table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+
    rows.map(cells=>`<tr>${cells.map(x=>`<td>${esc(val(x))}</td>`).join('')}</tr>`).join('')+'</table>';
}
function renderServiceTabs(){
  const s=status?.services||{};
  const fp=s.frps||{};
  el('tab-easytier').innerHTML =
    svcCard('easytier', s.easytier?.running, s.easytier?.enabled, [
      ['配置服务器端口 (UDP)', s.easytier?.config_server_port],

async function svcAction(name, action){
  if(action==='stop'){
    // Stopping persists enabled=false on the server (the module then stays down
    // across a reboot), which silently unticks 开机启用 — say so first.
    if(!confirm(`停止 ${TITLES[name]||name}？\n\n停止会同时关闭「开机启用」，重启后不再自动启动；\n下次点「启动」会自动重新启用。`)) return;
  }
  try{
    await api(`/api/service/${name}/${action}`,'POST',{});
    toast(`${name} ${action==='start'?'已启动':action==='stop'?'已停止':action+' 完成'}`);
  }catch(e){toast(e.message,false)}
  await refreshAll();
}
async function toggleEnabled(name, enabled){
  try{
    // Read the section fresh and send it whole: the server fills every missing
    // field with its default, so a partial PUT (e.g. {enabled:true}) would quietly
    // reset the rest of that service's configuration.
    const cfg = await api('/api/config/'+name);
    cfg.enabled = !!enabled;
    await api('/api/config/'+name,'PUT',cfg);
    toast(`${name} ${enabled?'已启用':'已禁用'}`);
  }catch(e){toast(e.message,false)}
  await refreshAll();
}

function flattenSchema(svc){
  // returns [{path, label, hint, widget}]
  // The schemas spell widgets as ['checkbox'] / ['number'] / ['textarea'];
  // unwrap that so callers can compare against a plain string, otherwise every
  // field falls back to a text input and booleans/numbers are sent as strings.
  const norm=(w)=>Array.isArray(w)?(w[0]||"text"):(w||"text");
  const out=[];
  for(const item of SCHEMAS[svc]||[]){
    if(Array.isArray(item[0])){ out.push(...item.map(x=>({path:x[0],label:x[1],hint:x[2]||'',widget:norm(x[3])}))); }
    else { out.push({path:item[0],label:item[1],hint:item[2]||'',widget:norm(item[3])}); }
  }
  return out;
}
function getPath(o, path){ return path.split('.').reduce((a,k)=>a?.[k], o) }
function setPath(o, path, v){ const ks=path.split('.'); const last=ks.pop(); ks.reduce((a,k)=>a[k]??=(a[k]={}),o)[last]=v }
/// A proxy table as the console's one-line syntax (the server parses it back).
function proxyLine(p){
  return [p.name, p.type||p.proxy_type||'tcp', p.local_ip||'127.0.0.1', p.local_port, p.remote_port].filter(x=>x!==undefined&&x!==null).join(' ');
}

async function openConfig(svc){
  // Always edit what the server has right now: a stale or missing copy would be
  // sent back as a whole-section PUT and silently reset every field it lacks.
  let cfg;
  try{
    cfg = await api('/api/config/'+svc);
  }catch(e){
    toast('读取配置失败，未打开编辑框: '+e.message,false);
    return;
  }
  configs[svc]=cfg;
  editService=svc;
  try{
    el('modal-title').textContent='配置 — '+TITLES[svc];
    el('modal-body').innerHTML=configFormHtml(svc, cfg);
    el('modal').classList.remove('hidden');
  }catch(e){ toast('生成配置表单失败: '+e.message, false) }
}
/// The editing controls for one service, from the configuration just read.
function configFormHtml(svc, cfg){
  const fields=flattenSchema(svc).map(f=>{
    if(f.widget==='hidden') return '';
    const v=getPath(cfg,f.path);
    if(f.widget==='checkbox')
      return `<div class="fg"><label class="switch" style="margin:0"><input type="checkbox" data-path="${f.path}" ${v?'checked':''}> ${esc(f.label)}</label></div>`;
    if(f.widget==='textarea'){
      // Arrays of tables (frpc proxies, TURN users) are edited as one line each;
      // a proxy table can also be sent as its one-line form, which the server
      // parses back into the same structure.
      const text = v===undefined||v===null ? '' : (Array.isArray(v) ? v.map(x=>typeof x==='string'?x:proxyLine(x)).join('\n') : v);
      return `<div class="fg"><label>${esc(f.label)}</label><textarea data-path="${f.path}" rows="4" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--tx);font-size:12px;font-family:monospace">${esc(text)}</textarea>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
    }
    const type = f.widget==='number' ? 'number' : 'text';
    return `<div class="fg"><label>${esc(f.label)}</label><input type="${type}" data-path="${esc(f.path)}" value="${esc(v)}">${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
  }).join('');
  // A certificate is what TURN-over-TLS and frps' TLS need; offer to mint one for
  // the domain entered above, or to install an existing pair (e.g. a real CA
  // cert). Either way the paths below are filled in automatically.
  const certSvc = {stun_turn:'turn', frps:'frps'}[svc];
  const certRow = certSvc
    ? `<div class="row" style="margin-top:12px"><button class="btn" onclick="genCert('${certSvc}')">🔐 生成自签证书</button>
       <button class="btn" onclick="uploadCert('${certSvc}')">📥 上传证书</button>
       <span class="hint" style="margin-left:8px">${svc==='stun_turn'?'生成按上方「域名」':'生成时会询问域名（本页无「域名」字段）'}，或粘贴已有 PEM；证书路径会自动写入本页配置</span></div>`
    : '';
  return fields+certRow+
    `<div class="hint" style="margin-top:6px">数字输入留空表示保持原值；保存会立即写入磁盘并对运行中的模块生效（服务端会重启该模块）。</div>`;
}
function closeModal(){el('modal').classList.add('hidden')}
async function saveModal(){
  if(!editService) return;
  if(!configs[editService]) return toast('配置尚未加载，未保存',false);
  const cfg=JSON.parse(JSON.stringify(configs[editService]));
  let bad=null;
  document.querySelectorAll('#modal-body [data-path]').forEach(elm=>{
    let v;
    if(elm.type==='checkbox') v=elm.checked;
    else if(elm.tagName==='TEXTAREA'){
      v=elm.value;
      // listeners / users / frpc proxies are string arrays (the server parses
      // each proxy line into the same table it would accept as JSON)
      if(['listeners','users','proxies'].includes(elm.dataset.path)) v=elm.value.split('\n').map(x=>x.trim()).filter(Boolean);
    }
    else if(elm.type==='number'){
      // empty numeric inputs keep the existing value rather than becoming 0
      if(elm.value.trim()==='') return;
      const n=Number(elm.value);
      // the backend deserializes into u16/u32/u64: a fraction or NaN would come
      // back as "invalid type: floating point/null", or silently as JSON null
      if(!Number.isInteger(n)||n<0){
        if(bad===null) bad=(elm.previousElementSibling?.textContent||elm.dataset.path||'').trim()||elm.dataset.path;
        return;
      }
      v=n;
    }
    else v=elm.value;
    setPath(cfg, elm.dataset.path, v);
  });
  if(bad) return toast('字段「'+bad+'」必须是整数：请修正后再保存',false);
  try{
    await api('/api/config/'+editService,'PUT',cfg);
    toast('配置已保存并应用');closeModal();await refreshAll();
  }catch(e){toast(e.message,false)}
}

/* ---------- certs ---------- */
async function genCert(svc){
  // Prefer the domain already typed in the open config modal, so generating a
  // certificate uses exactly the name that will be saved.
  const domField=document.querySelector('#modal-body [data-path="domain"]');
  let domain=domField?domField.value.trim():'';
  if(!domain) domain=prompt('证书域名 (CN/SAN):', location.hostname||'remgr.local');
  if(!domain) return;
  try{
    const r=await api('/api/system/certs/generate','POST',{service:svc,domain});
    toast('证书已生成: '+r.cert_path+(r.configured?.length?`（已写入 ${r.configured.join(', ')}）`:'')
      +(svc==='console'?' —— 点「立即应用」后控制台才会使用新证书，否则会被浏览器警告/无法访问':''), true);
    await refreshAll();
    if(svc==='console') await refreshConsoleCfg();
    if(editService&&!el('modal').classList.contains('hidden')) await openConfig(editService);
  }catch(e){toast(e.message,false)}
}
async function uploadCert(svc){
  const cert=prompt('粘贴证书 PEM（包含 BEGIN CERTIFICATE）:');
  if(!cert) return;
  const key=prompt('粘贴私钥 PEM（包含 PRIVATE KEY）:');
  if(!key) return;
  try{
    const r=await api('/api/system/certs/upload','POST',{service:svc,cert_pem:cert,key_pem:key});
    toast('证书已写入: '+r.cert_path+(r.configured?.length?`（已写入 ${r.configured.join(', ')}）`:'')
      +(svc==='console'?' —— 点「立即应用」后控制台才会使用新证书，否则会被浏览器警告/无法访问':''), true);
    await refreshAll();
    if(svc==='console') await refreshConsoleCfg();
    if(editService&&!el('modal').classList.contains('hidden')) await openConfig(editService);
  }catch(e){toast(e.message,false)}
}

let consoleCfg=null, consoleCfgErr=null;
async function refreshConsoleCfg(){

  catch(e){ consoleCfg=null; consoleCfgErr=e.message }

function setConsoleButtons(on){
  for(const id of ['console-save','console-apply']){
    const b=el(id); if(b) b.disabled=!on;

function renderConsoleForm(){
  const host=el('console-form'); if(!host) return;
  const c=consoleCfg;
  if(!c){
    // Rendering the defaults here would hand the operator a form that silently
    // overwrites the real settings on save — refuse instead.
    host.innerHTML=`<div class="fg"><label>控制台配置</label><div class="v" style="color:var(--red);font-size:12px">读取失败${consoleCfgErr?('：'+esc(consoleCfgErr)):''}——
      为避免用占位值覆盖磁盘上的设置，「保存」与「立即应用」已禁用。请稍后重试或刷新页面。</div></div>`;
    setConsoleButtons(false);
    return;
  }
  setConsoleButtons(true);
  const rows=[
    ['username','登录用户名',c.username??'admin'],
    ['port','控制台端口',c.port??9443],
    ['tls_cert','TLS 证书路径',c.tls_cert??''],
    ['tls_key','TLS 私钥路径',c.tls_key??''],
    ['session_ttl','会话有效期（秒）',c.session_ttl??604800],
  ].map(([p,l,v])=>`<div class="fg"><label>${esc(l)}</label><input data-cpath="${esc(p)}" value="${esc(v)}"></div>`).join('');
  host.innerHTML=rows+`<div class="fg"><label class="switch" style="margin:0"><input type="checkbox" data-cpath="tls" ${c.tls?'checked':''}> 启用 HTTPS（需证书；未启用则 HTTP）</label></div>`
    +`<div class="hint">配置值（已保存）：<code>${c.tls?'https':'http'}://${esc(location.hostname)}:${esc(c.port??9443)}/</code>
       —— 自签名证书浏览器会提示不受信任，可在此上传正式证书。</div>`;
}
function collectConsoleCfg(){
  if(!consoleCfg) throw new Error('控制台配置尚未读取成功');
  const c=JSON.parse(JSON.stringify(consoleCfg));
  document.querySelectorAll('#console-form [data-cpath]').forEach(elm=>{
    const p=elm.dataset.cpath;
    if(elm.type==='checkbox'){ c[p]=elm.checked; return }
    if(p==='username'){
      const u=elm.value.trim();
      if(!u) throw new Error('登录用户名不能为空');
      c[p]=u; return;
    }
    if(p==='port'||p==='session_ttl'){
      const raw=elm.value.trim();
      const name = p==='port'?'端口':'会话有效期';
      if(raw==='') throw new Error(name+'不能为空');
      const n=Number(raw);
      if(!Number.isInteger(n)||n<=0) throw new Error(name+'必须是正整数');
      if(p==='port'&&n>65535) throw new Error('端口必须在 1-65535 之间');
      c[p]=n; return;
    }
    c[p]=elm.value;
  });
  return c;
}
async function saveConsole(){
  if(!consoleCfg) return toast('控制台配置尚未读取成功，未保存',false);
  try{
    const c=collectConsoleCfg();
    await api('/api/config/console','PUT',c);
    toast('控制台设置已保存（端口/TLS 需点「立即应用」重新绑定后生效）');
  }catch(e){return toast(e.message,false)}
  await refreshConsoleCfg();
}
async function applyConsole(){
  if(!consoleCfg) return toast('控制台配置尚未读取成功，无法应用',false);
  if(!confirm('将保存当前表单并重新绑定控制台监听（端口/TLS 变更会短暂断连）。\n\n若新设置无法监听，服务端会退回上一次可用的设置。继续？')) return;
  let target;
  try{
    // Save what is on screen first: applying the *stored* settings while the
    // operator looks at edited fields would rebind somewhere they did not ask for.
    const c=collectConsoleCfg();
    await api('/api/config/console','PUT',c);
    target=`${c.tls?'https':'http'}://${location.hostname}:${c.port}/`;
    await api('/api/console/apply','POST',{});
  }catch(e){return toast(e.message,false)}
  toast('控制台正在重新绑定… 目标地址 '+target);
  const up=await waitConsoleUp(target, 15000);
  toast(up?'控制台已在新地址响应，正在跳转':'15 秒内未等到新地址响应（端口可能仍不可用），仍尝试跳转', up);
  if(location.href.replace(/\/$/,'')===target.replace(/\/$/,'')) location.reload();
  else location.replace(target);
}
/// Probe the address the console is being rebound to, so the operator is not
/// thrown at a dead port right after the restart window.
async function waitConsoleUp(target, ms){
  const end=Date.now()+ms;
  while(Date.now()<end){
    try{ await fetch(target+'api/status',{mode:'no-cors',cache:'no-store'}); return true }catch(e){}
    await new Promise(r=>setTimeout(r,700));
  }
  return false;
}
async function changePassword(){
  const old=el('pw-old').value, nw=el('pw-new').value;
  if(!old||!nw) return toast('请填写当前密码与新密码',false);
  if(nw.trim().length<4) return toast('新密码至少 4 位',false);
  try{
    // a wrong old password is a 401 too — surface the reason, not '未登录'
    await api('/api/console/password','POST',{old,new:nw},{noRelogin:true});
    el('pw-old').value=''; el('pw-new').value='';
    toast('密码已修改（其它已登录的会话已失效）');
  }catch(e){toast(e.message,false)}
}

/* ---------- logs ---------- */
async function tickLogs(){
  if(curTab!=='system') return;
  try{
    const d=await api('/api/logs?n=400');
    const lines=Array.isArray(d.lines)?d.lines:[];
    const host=el('logs');
    // Compare the text, not the line count: the server keeps a 1000-line ring and
    // n=400 always returns 400 lines once it is full, so a count check would stop
    // refreshing the view for good.
    const text=lines.join('\n');
    logErrShown=false;
    if(lastLogText===text) return;
    lastLogText=text;
    host.textContent=text;
    scrollLogs();
  }catch(e){
    if(!logErrShown){ logErrShown=true; toast('日志读取失败: '+e.message,false) }
  }
}
function scrollLogs(){const host=el('logs'); if(el('log-follow')?.checked) host.scrollTop=host.scrollHeight}
function downloadLogs(){
  // Prefer the file log: unlike the in-memory ring buffer it survives restarts.
  api('/api/logs?n=20000&file=1').catch(()=>api('/api/logs?n=1000')).then(d=>{
    const lines=(d&&Array.isArray(d.lines))?d.lines:[];
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'');
    const blob=new Blob([lines.join('\n')+'\n'],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    const url=URL.createObjectURL(blob);
    a.href=url;
    a.download=`remgr-log-${stamp}.txt`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  }).catch(e=>toast('下载日志失败: '+e.message,false));
}
function connectWS(){
  try{
    if(ws && (ws.readyState===0||ws.readyState===1)) return;   // one socket only
    const proto=location.protocol==='https:'?'wss':'ws';
    ws=new WebSocket(`${proto}://${location.host}/api/ws/logs`);
    ws.onopen=()=>{wsFails=0; connState(true,'已连接')};
    ws.onmessage=ev=>{
      if(curTab!=='system')return;
      const host=el('logs');
      host.textContent+='\n'+String(ev.data??'');
      // keep the DOM bounded — drop whole lines, and never cut inside one (a
      // single huge line without a newline used to loop forever)
      while(host.textContent.length>200000){
        const i=host.textContent.indexOf('\n');
        if(i<0){host.textContent=host.textContent.slice(-100000);break}
        host.textContent=host.textContent.slice(i+1);
      }
      lastLogText=null;   // let the next poll re-sync its signature
      scrollLogs();
    };
    ws.onclose=()=>{
      ws=null;
      // Not logged in (login overlay up) → no point retrying; boot() reconnects.
      if(el('app').classList.contains('hidden')) return;
      connState(false,'日志流已断开，重连中…');
      wsFails++;
      const delay=Math.min(4000*Math.pow(2,wsFails-1),30000);   // back off, do not hammer
      if(wsTimer) clearTimeout(wsTimer);
      wsTimer=setTimeout(connectWS, delay);
    };
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }catch(e){
    if(wsTimer) clearTimeout(wsTimer);
    wsFails++;
    wsTimer=setTimeout(connectWS, Math.min(4000*Math.pow(2,wsFails-1),30000));
  }
}

/* status poll */
setInterval(()=>{ if(status && !el('app').classList.contains('hidden')) refreshAll(); }, 10000);
el('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal() });
