[package]
name = "remgr-frps"
description = "frp (fast reverse proxy) server-side protocol implementation, wire-compatible with fatedier/frp clients"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util.workspace = true
tokio-util = { workspace = true, features = ["rt", "compat"] }

yamux = "0.13"
md-5 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = "0.13"
aes = "0.8"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha1 = "0.10"
